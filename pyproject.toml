[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-os"
version = "1.2.0"
description = "The governance kernel for AI agents. Cost enforcement, policy-as-code, self-healing CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Manzela" },
]
keywords = [
    "ai-governance",
    "ai-agents",
    "cost-management",
    "policy-as-code",
    "self-healing",
    "ci-cd",
    "devops",
    "llm",
    "guardrails",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
ag-os = "ag_os.cli:main"

[project.optional-dependencies]
gcp = [
    "google-cloud-secret-manager>=2.0",
    "google-cloud-storage>=2.0",
    "google-cloud-billing>=1.0",
]
aws = ["boto3>=1.28"]
vault = ["hvac>=2.0"]
jira = ["jira>=3.0"]
linear = []
redis = ["redis>=5.0"]
datadog = ["ddtrace>=2.0"]
cedar = []
mcp = ["mcp[cli]>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
all = ["ag-os[gcp,aws,jira,redis,mcp]"]

[project.urls]
Homepage = "https://github.com/Manzela/Antigravity-OS"
Documentation = "https://github.com/Manzela/Antigravity-OS#readme"
Repository = "https://github.com/Manzela/Antigravity-OS"
Issues = "https://github.com/Manzela/Antigravity-OS/issues"

[tool.setuptools.packages.find]
include = ["ag_os*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
