name: Feature Request
description: Propose a new feature for Antigravity OS.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you would like to see in Antigravity OS.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Describe the use case.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work? Be as specific as possible.

  - type: dropdown
    id: surface
    attributes:
      label: Integration Surface
      description: Which provider surface is this related to?
      options:
        - Secrets
        - Issues
        - Cost
        - State
        - Telemetry
        - Policy
        - CLI
        - Core / Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references.
