name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Closes CodeQL alert actions/missing-workflow-permissions (#7).
# CI only needs to read the repo and post coverage; nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        # Non-strict baseline; see pyproject.toml [tool.mypy].
        # Audit-plan.md P0-9 tracks the strict-mode follow-up.
        run: mypy ag_os

      - name: Test
        # Coverage flags come from pyproject.toml [tool.pytest.ini_options].
        run: pytest

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Security - Dependency Audit
        run: |
          pip install pip-audit
          pip-audit --desc --skip-editable

      - name: Verify governance demo
        run: |
          ag-os init --defaults
          ag-os check 1.0 --tier standard_cpu
          ag-os demo
          ag-os status
          ag-os serve --help
          ag-os dream --dry-run
          ag-os daemon status
