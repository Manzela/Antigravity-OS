[build-system]
# setuptools >=77.0 is required for the PEP 639 SPDX `license = "MIT"`
# string form below; older setuptools (68-76) reject it with
# "configuration error: project.license must be valid exactly by one definition".
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-os"
version = "1.4.0"
description = "The governance kernel for AI agents. Cost enforcement, policy-as-code, self-healing CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Manzela" },
]
keywords = [
    "ai-governance",
    "ai-agents",
    "cost-management",
    "policy-as-code",
    "self-healing",
    "ci-cd",
    "devops",
    "llm",
    "guardrails",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "keyring>=25.0.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
ag-os = "ag_os.cli:main"

[project.optional-dependencies]
gcp = [
    "google-cloud-secret-manager>=2.0",
    "google-cloud-storage>=2.0",
    "google-cloud-billing>=1.0",
]
aws = ["boto3>=1.28"]
vault = ["hvac>=2.0"]
jira = ["jira>=3.0"]
redis = ["redis>=5.0"]
datadog = ["ddtrace>=2.0"]
mcp = ["mcp[cli]>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pin matches .pre-commit-config.yaml (ruff-pre-commit v0.11.12) so
    # CI and pre-commit cannot diverge as new ruff rules ship.
    "ruff==0.15.16",
    "mypy>=1.8",
]
all = ["ag-os[gcp,aws,jira,redis,mcp]"]

[project.urls]
Homepage = "https://github.com/Manzela/Antigravity-OS"
Documentation = "https://github.com/Manzela/Antigravity-OS#readme"
Repository = "https://github.com/Manzela/Antigravity-OS"
Issues = "https://github.com/Manzela/Antigravity-OS/issues"
Changelog = "https://github.com/Manzela/Antigravity-OS/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ag_os*"]

[tool.setuptools.package-data]
ag_os = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Expanded rule set — see audit/audit-plan.md (P1-10).
# - B   flake8-bugbear (mutable defaults, raise-from-loss)
# - S   flake8-bandit  (subprocess shell=True, hardcoded creds)
# - UP  pyupgrade      (modern syntax for >=3.10)
# - RUF ruff-native    (mutable class attrs, implicit-Optional)
# - SIM flake8-simplify
# - C4  flake8-comprehensions
# - PTH flake8-use-pathlib
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "RUF", "SIM", "C4", "PTH"]
ignore = [
    # Stylistic Path.open() migration — 25 sites across 9 files. Worth doing
    # but mechanical; tracked as audit-plan.md P1-10 follow-up rather than
    # bundled into this PR. PTH100+ (other path rules) stay enforced.
    "PTH123",
]

[tool.ruff.lint.per-file-ignores]
# `assert` is the standard pytest assertion mechanism.
# Subprocess in test fixtures is fine.
"tests/*" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ag_os --cov-report=term-missing --cov-report=xml --tb=short -q"

[tool.coverage.run]
source = ["ag_os"]
branch = true
omit = [
    "ag_os/__init__.py",
]

[tool.coverage.report]
# No `fail_under` yet — establish the baseline first; audit-plan.md P1-7
# documents the follow-up to set a floor (target: 70+).
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
# Non-strict baseline (audit-plan.md P0-9). Strict mode is the follow-up
# once existing type errors are addressed; today this catches unannotated
# new code in CI without forcing an immediate fix-everything-at-once PR.
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
# Per-module overrides
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
